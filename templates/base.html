<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Hostel Visitor System{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container">
<a class="navbar-brand fw-bold" href="/">🏨 Hostel Visitor System</a>
<div>{% if user.is_authenticated %}
<a class="btn btn-light btn-sm me-1" href="/">Dashboard</a>
{% if user.student_profile %}<a class="btn btn-outline-light btn-sm me-1" href="/visitors/register/">New Visitor</a>{% else %}
<a class="btn btn-outline-light btn-sm me-1" href="/visitors/warden/">Warden</a>
<a class="btn btn-outline-light btn-sm me-1" href="/visitors/security/">Security</a>{% endif %}
<a class="btn btn-dark btn-sm" href="/accounts/logout/">Logout</a>
{% else %}<a class="btn btn-light btn-sm me-1" href="/accounts/login/">Login</a><a class="btn btn-outline-light btn-sm" href="/accounts/register/">Student Register</a>{% endif %}
</div></div></nav>
<div class="container py-4">{% for message in messages %}<div class="alert alert-info">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</div>
</body></html>
