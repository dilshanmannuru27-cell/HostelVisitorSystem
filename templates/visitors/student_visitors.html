{% extends 'base.html' %}{% block content %}<h2>My Visitors</h2><a class="btn btn-primary mb-3" href="/visitors/register/">Register Visitor</a><div class="card"><div class="card-body table-responsive"><table class="table"><tr><th>Visitor</th><th>Date</th><th>Purpose</th><th>Status</th></tr>{% for r in requests %}<tr><td>{{r.visitor.name}}</td><td>{{r.visit_date}}</td><td>{{r.purpose}}</td><td>{{r.status}}</td></tr>{% empty %}<tr><td colspan="4">No requests.</td></tr>{% endfor %}</table></div></div>{% endblock %}
